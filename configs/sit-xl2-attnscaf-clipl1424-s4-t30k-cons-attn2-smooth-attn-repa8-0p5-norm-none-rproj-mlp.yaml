# CLIP ViT-L/14 final-layer K/V scaffold at SiT block 4
# with output internalization, smooth withdrawal, and plain REPA at block 8.
#
#   0--25K:    CLIP K/V scaffold + REPA.
#   25--30K:   cosine blend to native attention + REPA.
#   30--100K:  native attention + output internalization + REPA.

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 8
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# CLIP-L/14 K/V scaffold at SiT block 4
# ============================================================================
use-kv: true
scaffold-interface: kv
scaffold-feature-source: attn_input
enc-type: clip-L
enc-layer-indices: "24"
sit-layer-indices: "4"

stage1-steps: 30000
transition-steps: 5000
transition-schedule: cosine

kv-stop-step: -1
align-mode: attn_mse
distill-coeff: 2.0
distill-warmup-steps: 0

kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# Plain REPA at SiT block 8 using CLIP final patch representations
# ============================================================================
repa-loss: true
proj-coeff: "0.5"
projection-loss-type: cosine_repa
spnorm-method: none
zscore-alpha: 0.6
repa-stop-step: -1
repa-stop-fade-steps: 0

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 100000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
