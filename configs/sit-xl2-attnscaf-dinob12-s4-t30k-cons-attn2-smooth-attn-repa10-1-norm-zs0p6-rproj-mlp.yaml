# Full K/V AttnScaf + output consistency + REPA with a smooth 5K withdrawal.
#
#   0--25K:    encoder K/V scaffold + REPA.
#   25--30K:   cosine blend from scaffolded to native attention + REPA.
#   30--100K:  native attention + output consistency (lambda=2) + REPA.
#
# This differs from the FID-11.95 full recipe only by transition-steps=5000.
# A matching full-recipe 25K checkpoint may be reused; otherwise start at 0.

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# K/V scaffold + smooth withdrawal + output consistency
# ============================================================================
use-kv: true
scaffold-interface: kv
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "4"

stage1-steps: 30000
transition-steps: 5000
transition-schedule: cosine

kv-stop-step: -1
align-mode: attn_mse
distill-coeff: 2.0
distill-warmup-steps: 0

kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# REPA alignment (MLP head + spatial z-score target)
# ============================================================================
repa-loss: true
proj-coeff: "1.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6
repa-stop-step: -1
repa-stop-fade-steps: 0

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 400000
checkpointing-steps: 100000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
