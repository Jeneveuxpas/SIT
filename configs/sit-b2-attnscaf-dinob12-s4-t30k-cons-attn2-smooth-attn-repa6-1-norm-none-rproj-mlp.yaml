# SiT-B/2 scaling run with the final AttnScaf + plain REPA recipe.
# This exactly follows the XL headline configuration:
#   - DINO block 12 K/V scaffold at SiT block 4;
#   - 25K pure scaffold + 5K cosine withdrawal;
#   - attention-output internalization after 30K (lambda=2);
#   - plain REPA at SiT block 8 with coefficient 1.0.
#
# The alignment recipe uses the original REPA cosine objective without
# SpatialNorm, matching the XL/2 plain-REPA configuration.

model: SiT-B/2-EncoderKV
num-classes: 1000
encoder-depth: 6
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

use-kv: true
scaffold-interface: kv
scaffold-feature-source: attn_input
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "4"
stage1-steps: 30000
transition-steps: 5000
transition-schedule: cosine
kv-stop-step: -1
align-mode: attn_mse
distill-coeff: 2.0
distill-warmup-steps: 0
kv-replace-mode: kv
kv-memory-mode: replace
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

repa-loss: true
proj-coeff: "1.0"
projection-loss-type: cosine_repa
spnorm-method: none
zscore-alpha: 0.6
repa-stop-step: -1
repa-stop-fade-steps: 0

data-dir: /dev/shm/data
resolution: 256
batch-size: 256
epochs: 1400
max-train-steps: 400000
checkpointing-steps: 100000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1
allow-tf32: true
mixed-precision: fp16
compile: true
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
