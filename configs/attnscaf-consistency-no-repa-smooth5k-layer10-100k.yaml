# Standalone K/V AttnScaf at SiT block 10 with a smooth 5K withdrawal.
# No REPA and no K/V normalization.
#
#   0--25K:    DINOv2 K/V scaffold at SiT block 10.
#   25--30K:   cosine blend from scaffolded to native attention output.
#   30--100K:  native attention + output consistency (lambda=2).
#
# This is a strict layer-position counterpart to the block-4 smooth run.
# Start from step 0 because the scaffolded SiT block has changed.

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# K/V scaffold at SiT block 10 + smooth withdrawal + consistency
# ============================================================================
use-kv: true
scaffold-interface: kv
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "10"

stage1-steps: 30000
transition-steps: 5000
transition-schedule: cosine

kv-stop-step: -1
align-mode: attn_mse
distill-coeff: 2.0
distill-warmup-steps: 0

kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# REPA disabled
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 5000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
