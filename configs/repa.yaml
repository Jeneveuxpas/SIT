# Evaluation config for the official REPA checkpoint:
# REPA-E/iREPA-collections/exps_irepa_400k/
# sit-xl-2-dinov2-vit-b-repa/checkpoints/{0100000,0400000}.pt
#
# eval_ckpts.sh reads only model and resolution. The remaining fields document
# the checkpoint's official args.json and are not used during sampling.

model: SiT-XL/2
resolution: 256

# Official training metadata
num-classes: 1000
encoder-depth: 8
fused-attn: true
qk-norm: false
enc-type: dinov2-vit-b
repa-loss: true
proj-coeff: "0.5"
projection-loss-type: cosine
spnorm-method: none
zscore-alpha: 1.0
path-type: linear
prediction: v
vae: mse
