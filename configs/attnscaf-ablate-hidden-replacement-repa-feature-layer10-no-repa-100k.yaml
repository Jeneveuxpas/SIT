# Literal hidden-state replacement using the exact DINO feature used by REPA.
#
#   0--30K:    after SiT block 10, replace the complete hidden state with a
#              bias-free linear projection of DINOv2 x_norm_patchtokens.
#   30--100K:  restore the native block-10 hidden state and match it to the
#              detached projected DINO feature with MSE (lambda=2).
#
# This intentionally removes the noisy generative state accumulated through
# block 10 during the scaffold window. It is a diagnostic interface control,
# not a residual injection. Start from step 0; do not resume a K/V checkpoint.

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# REPA-feature hidden-state scaffold
# ============================================================================
use-kv: true
scaffold-interface: hidden
scaffold-feature-source: repa
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "10"

stage1-steps: 30000
transition-steps: 0
transition-schedule: cosine

kv-stop-step: -1
align-mode: attn_mse
distill-coeff: 2.0
distill-warmup-steps: 0

# Inactive for hidden mode; retained for protocol parity.
kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# REPA loss disabled: DINO features participate only through the scaffold.
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 5000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
