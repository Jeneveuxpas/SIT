# Ablation: Attention Residual Scaffold, without REPA and without K/V norm.
#
# This is a fresh 100K run; do not resume from a K/V-scaffold checkpoint.
#
#   0--30K: projected DINOv2 attention-input hidden state replaces the selected
#            SiT block's attention residual update.
#   30--100K: native SiT attention returns and is trained with an output-level
#              handoff MSE against the detached residual teacher.
#
# Usage:
#   ./launch.sh \
#     --config configs/attnscaf-ablate-residual-scaffold-no-repa-100k.yaml \
#     --exp-name attnscaf-ablate-residual-scaffold-no-repa-100k \
#     --gpu 0,1,2,3 --num-gpus 4

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# Encoder scaffold
# ============================================================================
use-kv: true
scaffold-interface: residual
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "4"

stage1-steps: 30000
transition-steps: 0

align-mode: attn_mse
distill-coeff: 2.0
distill-warmup-steps: 0

# Keep the residual teacher available through the 100K comparison point.
kv-stop-step: -1

# Retained for protocol parity with the K/V run; residual mode uses one
# bias-free linear hidden-state projection and does not use these K/V options.
kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# REPA disabled
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 5000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
