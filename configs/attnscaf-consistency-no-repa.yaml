# AttnScaf + attention-output consistency, without REPA.
# Purpose: feature-target-free AttnScaf run, without REPA and without K/V norm.
#
# Stage 1: native SiT Q attends to frozen DINOv2 K/V at layer 4.
# Stage 2: native SiT attention is trained with attention-output consistency.
# Inference uses the same architecture/input as base SiT; encoder is training-only.
#
# Usage:
#   ./launch.sh --config configs/attnscaf-consistency-no-repa-100k.yaml \
#     --exp-name attnscaf-consistency-no-repa-100k --gpu 0,1,2,3 --num-gpus 4

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# Encoder K/V Scaffold + Stage2 Consistency
# ============================================================================
use-kv: true
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "4"
stage1-steps: 30000
transition-steps: 0

# Keep encoder branch available after Stage 1 as the teacher for consistency.
kv-stop-step: -1

align-mode: attn_mse
distill-coeff: 2.0
distill-warmup-steps: 0

kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# REPA Disabled
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 5000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
