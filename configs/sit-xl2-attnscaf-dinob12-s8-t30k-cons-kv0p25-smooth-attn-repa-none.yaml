# Matched internalization ablation: retain the original attention-output
# smooth withdrawal, but directly align native K/V with projected encoder K/V
# after the scaffold leaves the denoising path.
#
#   0--25K:    native SiT queries attend to DINOv2 keys and values.
#   25--30K:   cosine blend from scaffolded to native attention output.
#   30--100K:  native self-attention with direct K/V internalization
#              against detached projected DINOv2 K/V (lambda=2).

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# DINOv2 K/V scaffold at SiT block 8
# ============================================================================
use-kv: true
scaffold-interface: kv
scaffold-feature-source: attn_input
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "8"

stage1-steps: 30000
transition-steps: 5000
transition-schedule: cosine
transition-blend-mode: output

kv-stop-step: -1
align-mode: kv_mse
distill-coeff: 0.25
distill-warmup-steps: 0

# Disable the default timestep weighting in kv_mse for a matched comparison.
kv-distill-snr-gamma: 1.0
kv-distill-min-weight: 1.0

kv-replace-mode: kv
kv-memory-mode: replace
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# REPA disabled
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 100000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
