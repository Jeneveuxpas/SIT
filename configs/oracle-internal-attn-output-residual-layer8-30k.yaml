# Oracle interface diagnostic: inject the selected DINO block's internal
# attention-branch output while preserving the native SiT residual stream.
#
# This is the internal-layer counterpart to
# oracle-residual-injection-layer8-30k.yaml, which uses DINO's final normalized
# patch feature. It is matched to the internal K/V and Q/K/V oracle controls at
# DINO block 12 and SiT block 8.

model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

use-kv: true
scaffold-interface: residual
scaffold-feature-source: attn_output
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "8"
stage1-steps: 30000
transition-steps: 0
kv-stop-step: 30000
align-mode: attn_mse
distill-coeff: 0.0
kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

data-dir: /dev/shm/data
resolution: 256
batch-size: 256
epochs: 1400
max-train-steps: 30000
checkpointing-steps: 30000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1
allow-tf32: true
mixed-precision: fp16
compile: true
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
