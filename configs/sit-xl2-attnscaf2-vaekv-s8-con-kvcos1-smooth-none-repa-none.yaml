# VAE-encoder scaffold control. Matches
# sit-xl2-attnscaf-src-latent-s8-t20k-cons-kvcos1-smooth-none-repa-none.yaml
# key for key, except the scaffold memory comes from the K/V of the frozen
# sd-vae-ft-mse encoder's mid-block attention instead of the raw latent x_0.
#
# The VAE mid attention runs on the 32x32 latent grid, so its K/V are turned
# into SiT tokens by the same space-to-depth operator used for x_0:
# 32x32x512 -> 16x16 tokens of 512*2*2 = 2048 dims. Lossless, and the token
# grid lines up with SiT patches exactly.
#
#   0--20K:    native SiT queries attend to K/V projected from VAE mid attention.
#   20--100K:  native self-attention with K/V internalization (kv_cos, lambda=1)
#              against the detached projected VAE K/V.
#
# Same clean-image information as the x_0 control, but expressed in the
# representation the VAE encoder builds right before compression. Sits between
# "raw latent" and "pretrained semantic encoder" on the scaffold-source axis.
#
# NOTE: this run needs raw images (one VAE encoder forward per step), so the
# dataloader uses HFImgLatentDataset. No DINO is loaded (repa-loss is false).

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# VAE mid-attention K/V scaffold at SiT block 8
# ============================================================================
use-kv: true
scaffold-interface: kv
scaffold-feature-source: vae_attn
# enc-type and enc-layer-indices are unused when scaffold-feature-source=vae_attn.
# enc-layer-indices only has to match sit-layer-indices in length.
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "8"

stage1-steps: 20000
transition-steps: 0
transition-schedule: cosine
transition-blend-mode: output

kv-stop-step: -1
align-mode: kv_cos
distill-coeff: 1.0
distill-warmup-steps: 0

kv-distill-snr-gamma: 1.0
kv-distill-min-weight: 1.0

kv-replace-mode: kv
kv-memory-mode: replace
# enc_dim is 512*2*2 = 2048 here. layernorm (not none) because the raw VAE K/V
# have their own per-channel scale; normalizing the projection input keeps the
# initial K/V magnitude close to native.
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: layernorm
kv-zscore-alpha: 1.0

# ============================================================================
# REPA disabled
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 20000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256