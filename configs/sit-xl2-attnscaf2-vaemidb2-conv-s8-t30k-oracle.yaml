# Oracle diagnostic: VAE mid.block_2 contextual feature -> learned stride-2
# convolutional K/V projectors -> SiT block 8, kept active during sampling.
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

use-kv: true
scaffold-interface: kv
scaffold-feature-source: vae_mid_block2
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "8"
stage1-steps: 30000
transition-steps: 0
kv-stop-step: 30000
align-mode: attn_mse
distill-coeff: 0.0
kv-replace-mode: kv
kv-memory-mode: replace

# Input memory is [B,1,1024,512] (32x32).  Independent K/V convolutions map
# 512x32x32 -> 1152x16x16 before reshaping into 16 SiT heads.
kv-proj-type: conv
kv-proj-kernel-size: 3
kv-proj-stride: 2
kv-norm-type: layernorm
kv-zscore-alpha: 1.0

repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

data-dir: /dev/shm/data
resolution: 256
batch-size: 256
epochs: 1400
max-train-steps: 30000
checkpointing-steps: 30000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1
allow-tf32: true
mixed-precision: fp16
compile: true
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
