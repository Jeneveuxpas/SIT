# Ablation: Q/K/V scaffold + Stage-2 consistency, without REPA alignment.
# Purpose: test whether replacing Q as well as K/V helps or hurts the scaffold.

# ============================================================================
# Model Configuration
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# Encoder Q/K/V Scaffold Configuration
# ============================================================================
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "4"
use-kv: true
stage1-steps: 30000
distill-coeff: 2.0

# Keep the encoder branch active after Stage 1 so Stage-2 consistency is applied.
kv-stop-step: -1

# Stage-2 consistency objective.
align-mode: attn_mse

# Q/K/V projection: linear, mlp, conv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: k_rms_v_layer
kv-zscore-alpha: 1.0
kv-replace-mode: qkv

# ============================================================================
# Disable REPA Loss
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 100000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision & Performance
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
