# AttnScaf + attention-output consistency, without REPA.
# Distillation-coefficient ablation: lambda = 1.0.
#
# Protocol:
#   0--30K:    native SiT Q attends to frozen DINOv2 K/V at layer 4.
#   30--100K:  native SiT attention + always-on output consistency.
#   Inference:  native SiT only; the encoder is training-only.
#
# Efficient resume from the common 30K checkpoint:
#   1. Copy 0030000.pt into:
#        exps/attnscaf-consistency-no-repa-lambda1-100k/checkpoints/
#   2. Run:
#        ./launch.sh \
#          --config configs/attnscaf-consistency-no-repa-lambda1-100k.yaml \
#          --exp-name attnscaf-consistency-no-repa-lambda1-100k \
#          --gpu 0,1,2,3 --num-gpus 4 --resume-step 30000

# ============================================================================
# Model
# ============================================================================
model: SiT-XL/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

# ============================================================================
# Encoder K/V scaffold + attention-output consistency
# ============================================================================
use-kv: true
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "4"
stage1-steps: 30000
transition-steps: 0

# Keep the encoder branch available as the training-only consistency teacher.
kv-stop-step: -1

align-mode: attn_mse
distill-coeff: 1.0
distill-warmup-steps: 0

kv-replace-mode: kv
kv-proj-type: linear
kv-proj-kernel-size: 1
kv-norm-type: none
kv-zscore-alpha: 1.0

# ============================================================================
# REPA disabled
# ============================================================================
repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

# ============================================================================
# Dataset
# ============================================================================
data-dir: /dev/shm/data
resolution: 256
batch-size: 256

# ============================================================================
# Training
# ============================================================================
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 100000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1

# ============================================================================
# Precision
# ============================================================================
allow-tf32: true
mixed-precision: fp16
compile: true

# ============================================================================
# Misc
# ============================================================================
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
