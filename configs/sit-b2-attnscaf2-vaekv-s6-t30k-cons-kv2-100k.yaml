# Normal two-stage training with genuine SD-VAE mid-attention K/V.
# 0--30K: clean VAE attention K/V replace block-6 K/V.
# 30--100K: native K/V are used and aligned to detached VAE K/V (lambda=2).
model: SiT-B/2-EncoderKV
num-classes: 1000
encoder-depth: 10
fused-attn: true
qk-norm: false
projection-layer-type: mlp
proj-kwargs-kernel-size: 3

use-kv: true
scaffold-interface: kv
# Preserve the native 32x32 Q/K/V maps until the spatial projector.  This
# makes the K/V projector directly comparable to the mid.block_2 branch.
scaffold-feature-source: vae_attn_spatial
enc-type: dinov2-b
enc-layer-indices: "12"
sit-layer-indices: "6"

stage1-steps: 30000
transition-steps: 0
transition-schedule: cosine
transition-blend-mode: output
kv-stop-step: -1
align-mode: kv_mse
distill-coeff: 2.0
distill-warmup-steps: 0
kv-distill-snr-gamma: 1.0
kv-distill-min-weight: 1.0

kv-replace-mode: kv
kv-memory-mode: replace
# Each native VAE K/V map independently uses the same best projector:
# [512,32,32] -> Conv3x3(s2,p1) -> MLP5 -> [12,256,64].
kv-proj-type: conv_mlp5
kv-proj-kernel-size: 3
kv-proj-stride: 2
kv-norm-type: layernorm
kv-post-norm-type: none
kv-zscore-alpha: 1.0

repa-loss: false
proj-coeff: "0.0"
projection-loss-type: cosine
spnorm-method: zscore
zscore-alpha: 0.6

data-dir: /dev/shm/data
resolution: 256
batch-size: 256
epochs: 1400
max-train-steps: 100000
checkpointing-steps: 100000
sampling-steps: 100000
gradient-accumulation-steps: 1
learning-rate: 1e-4
adam-beta1: 0.9
adam-beta2: 0.999
adam-weight-decay: 0.0
adam-epsilon: 1e-8
max-grad-norm: 1.0
ema-decay: 0.9999
ema-update-freq: 1
allow-tf32: true
mixed-precision: fp16
compile: true
seed: 0
num-workers: 12
cfg-prob: 0.1
path-type: linear
prediction: v
n-samples: 256
